# Sona (Next.js) on Netlify. This lives in web/, so the Netlify site for Sona
# has its base directory set to `web`. Deploy via git-connected CI (the reliable
# path for the Next runtime); the @netlify/plugin-nextjs runtime wires the server
# handler and edge middleware during the Netlify build.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
